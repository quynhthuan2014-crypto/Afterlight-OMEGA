<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thành Phố Cuối Cùng: Afterlight OMEGA</title><style>html,body{margin:0;height:100%;background:#030709;color:#eaf8f4;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.box{width:min(760px,92vw);padding:32px;border:1px solid #28434a;border-radius:20px;background:#071014;box-shadow:0 20px 60px #000}.btn{display:inline-block;margin-top:16px;padding:12px 16px;border-radius:12px;background:#77f2d1;color:#04110f;text-decoration:none;font-weight:800}small{color:#92aaa6}</style></head><body><main class="box"><h1>Thành Phố Cuối Cùng: Afterlight OMEGA</h1><p>Trình khởi chạy GitHub Pages đang tải game 13.8…</p><p><small>Nếu trình duyệt không tự giải nén được bản game, hãy mở bản HTML phát hành từ repository.</small></p><a class="btn" href="https://github.com/quynhthuan2014-crypto/Afterlight-OMEGA">Mở repository</a></main><script>(async()=>{try{const r=await fetch('game.html.gz',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const ds=new DecompressionStream('gzip');const stream=r.body.pipeThrough(ds);const text=await new Response(stream).text();if(!text.includes('<!doctype html>')||!text.includes('</html>'))throw new Error('Bản game không đầy đủ');document.open();document.write(text);document.close();}catch(e){console.error(e);document.querySelector('p').textContent='Không thể tải bản game đầy đủ: '+e.message;}})();</script></body></html>
